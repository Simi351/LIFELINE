<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010402"><title>Mission Lifeline // Team</title><style>
:root{--bg:#010402;--panel:#06110a;--line:#174d26;--green:#00ff66;--green2:#8dffac;--dim:#4a815b;--text:#d8ffe4;--red:#ff4d67;--yellow:#d7ff4f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#010402;color:var(--text)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,102,.028) 0 1px,transparent 1px 4px);z-index:20}
body:after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #000;z-index:21}
#matrix{position:fixed;inset:0;opacity:.14;z-index:-1}.wrap{max-width:1320px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;gap:15px}.brand{font-size:24px;font-weight:950;color:var(--green);letter-spacing:.09em;text-shadow:0 0 14px #00ff6666}.sub{font-size:11px;color:var(--dim);margin-top:5px}.clock{font-size:12px;color:var(--green2)}
button{font:inherit;font-weight:900;border:1px solid #19713a;background:#06170b;color:var(--green2);padding:11px 14px;border-radius:4px;cursor:pointer;text-transform:uppercase}
button.primary{background:#0b3b18;color:#caffd4}.warn{color:var(--yellow)!important;border-color:#607116!important}.danger{color:#ff7a8d!important;border-color:#7b1f31!important;background:#210810!important}
.card{background:linear-gradient(145deg,#06140af2,#020805f2);border:1px solid var(--line);padding:20px;border-radius:6px;box-shadow:0 0 30px #00ff6610}.hero{padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}.hidden{display:none!important}.title{font-size:20px;font-weight:900;color:var(--green)}.big{font-size:44px;font-weight:950;color:var(--green)}
.muted{color:var(--dim)}.small{font-size:11px}.terminal{background:#000801;border:1px solid #0d3a1a;padding:14px;border-radius:4px;line-height:1.6;white-space:pre-wrap}
.status{display:inline-block;padding:4px 7px;border:1px solid currentColor;border-radius:3px;font-size:10px;font-weight:900}.online{color:var(--green)}.locked{color:#557060}.warnc{color:var(--yellow)}.red{color:var(--red)}
.progress{height:8px;background:#07170b;border:1px solid #164d25}.progress>div{height:100%;background:var(--green);box-shadow:0 0 12px #00ff66}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.core{padding:14px;border:1px solid #123f1f;background:#041008;margin:8px 0}.core b{display:block;color:var(--green2);margin-bottom:5px}
input,select,textarea{width:100%;background:#010703;border:1px solid #1b5a2c;color:var(--text);padding:12px;border-radius:3px;font:inherit;margin:6px 0 12px}textarea{min-height:100px;resize:vertical}
label{font-size:11px;color:var(--dim);display:block;margin-top:8px}.pin{letter-spacing:.45em;text-align:center;font-size:25px}.matrix-table{width:100%;border-collapse:collapse;font-size:12px}.matrix-table th,.matrix-table td{border:1px solid #164d25;padding:8px;text-align:center}.matrix-table th{color:var(--green2);background:#07140a}.matrix-table td input,.matrix-table td select{margin:0;padding:7px;min-width:125px}
.live-dot{width:14px;height:14px;border-radius:50%;background:#27332b;border:1px solid #54645a;display:inline-block}.live-dot.on{background:var(--green);box-shadow:0 0 18px #00ff66;animation:pulse 1.15s infinite}.online-card{border-color:#00ff66;box-shadow:0 0 34px #00ff6635}
@keyframes pulse{50%{opacity:.45;transform:scale(.83)}}.global-online{text-align:center;border-color:#00ff66;box-shadow:0 0 60px #00ff6640}
.notice{position:fixed;right:8px;bottom:8px;z-index:30;font-size:10px;padding:6px 8px;border:1px solid #174d26;background:#020805;color:#5fa572;border-radius:3px}
.footer{text-align:center;color:#315c3d;font-size:10px;margin:26px 0}
@media(max-width:650px){.brand{font-size:17px}.big{font-size:35px}.wrap{padding:10px}.hero{padding:19px}}

.countdown-screen{text-align:center;border-color:#00ff66;box-shadow:0 0 60px #00ff6645}.countdown-number{font-size:min(28vw,170px);font-weight:950;color:#00ff66;text-shadow:0 0 30px #00ff66;line-height:1}.complete-title{font-size:min(11vw,70px);font-weight:950;color:#00ff66;text-shadow:0 0 30px #00ff66;text-align:center}
</style></head>
<body><canvas id="matrix"></canvas><div class="wrap">
<header class="top"><div><div class="brand">MISSION LIFELINE // FIELD TERMINAL</div><div class="sub">MULTIPLAYER REALTIME SYSTEM</div></div><div class="clock" id="clock">--:--:--</div></header>
<section id="loginCard" class="card hero"><div class="title">&gt;&gt; IDENTIFICATION REQUIRED</div><p class="muted">Gib euren vierstelligen Teamcode ein.</p><label>TEAM ACCESS CODE</label><input id="teamPin" class="pin" inputmode="numeric" maxlength="4" placeholder="0000"><div class="row">
<button id="loginBtn" class="primary" type="button">AUTHENTICATE</button>
<button id="voiceTestBtn" type="button">🔊 STIMME TESTEN</button>
</div><div id="loginMsg"></div></section>
<section id="game" class="hidden"></section>
</div><div id="net" class="notice">CONNECTING...</div><div class="footer">V10 MULTIPLAYER TEAM CLIENT</div>
<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getDatabase, ref, get, onValue, set, update, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
const $=id=>document.getElementById(id), TEAM_NAMES=["ALPHA","BRAVO","CHARLIE","DELTA","ECHO","FOXTROT"];
let db,auth,cfg=null,team=sessionStorage.getItem("lifelineTeamV10")||null,state=null,globalState=null,allTeamStates={},unsubTeam=null,countdownTimer=null,lastSpokenSecond=null,countdownStartPending=false;
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function sha256Sync(ascii){
 function rightRotate(value,amount){return (value>>>amount)|(value<<(32-amount))}
 const mathPow=Math.pow,maxWord=mathPow(2,32),lengthProperty="length";
 let i,j,result="",words=[],asciiBitLength=ascii[lengthProperty]*8;
 let hash=sha256Sync.h=sha256Sync.h||[],k=sha256Sync.k=sha256Sync.k||[],primeCounter=k[lengthProperty],isComposite={};
 for(let candidate=2;primeCounter<64;candidate++){
   if(!isComposite[candidate]){
     for(i=0;i<313;i+=candidate)isComposite[i]=candidate;
     hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
     k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
   }
 }
 ascii+="\x80";
 while(ascii[lengthProperty]%64-56)ascii+="\x00";
 for(i=0;i<ascii[lengthProperty];i++){
   j=ascii.charCodeAt(i);
   if(j>>8)return "";
   words[i>>2]|=j<<((3-i)%4)*8;
 }
 words[words[lengthProperty]]=(asciiBitLength/maxWord)|0;
 words[words[lengthProperty]]=asciiBitLength;
 for(j=0;j<words[lengthProperty];){
   let w=words.slice(j,j+=16),oldHash=hash.slice(0);
   for(i=0;i<64;i++){
     let i2=i+j,w15=w[i-15],w2=w[i-2];
     let a=hash[0],e=hash[4];
     let temp1=hash[7]+(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(
       w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10))
     )|0);
     let temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
     hash=[(temp1+temp2)|0,a,hash[1],hash[2],(hash[3]+temp1)|0,e,hash[5],hash[6]];
   }
   for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
 }
 for(i=0;i<8;i++)for(j=3;j+1;j--){let b=(hash[i]>>(j*8))&255;result+=(b<16?"0":"")+b.toString(16)}
 return result;
}

async function sha(text){const data=new TextEncoder().encode(String(text));const digest=await crypto.subtle.digest("SHA-256",data);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function route(){return cfg.routes[team]} function currentIdx(){return state.step<route().length?route()[state.step]:null}
async function boot(){
 try{
  if(!firebaseConfig.apiKey||firebaseConfig.apiKey.includes("HIER_"))throw new Error("Firebase-Konfiguration fehlt");
  const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);
  onAuthStateChanged(auth,u=>{if(u)connectConfig()});
  await signInAnonymously(auth);
 }catch(e){$("net").textContent="ERROR";$("net").style.color="#ff7083";$("loginMsg").innerHTML='<div class="terminal red">'+esc(e.message)+'</div>'}
}
let configStarted=false;
function connectConfig(){
 if(configStarted)return;configStarted=true;
 onValue(ref(db,"mission/publicConfig"),snap=>{
 cfg=snap.val();
 if(cfg){
   $("net").textContent="REALTIME CONNECTED";
   if(team && !unsubTeam)connectTeam();
   if(state){lastScreenKey="";render();}
 }else{
   $("net").textContent="WAITING FOR GAME MASTER";
 }

 onValue(ref(db,"mission/teams"),snap=>{
   allTeamStates=snap.val()||{};
   maybeStartCountdownFromTeamClients();
 });
});
 onValue(ref(db,"mission/globalState"),snap=>{globalState=snap.val()||null;if(team&&state&&globalState&&state.runId!==globalState.runId){resetThisTeamForRun();return}maybeStartCountdownFromTeams();render();});
 onValue(ref(db,"mission/teams"),snap=>{allTeamStates=snap.val()||{};maybeStartCountdownFromTeams();});
}
async function login(){
 if(!cfg){
   $("loginMsg").innerHTML='<div class="terminal warnc">Mission noch nicht initialisiert.</div>';
   return
 }

 const pin=$("teamPin").value.trim();
 const entered=sha256Sync(pin);
 const found=TEAM_NAMES.find(n=>cfg.teamPinHashes[n]===entered);

 if(!found){
   $("loginMsg").innerHTML='<div class="terminal red">ACCESS DENIED // TEAMCODE UNGÜLTIG</div>';
   speakDeep("Authentifizierung fehlgeschlagen. Zugangscode ungültig.");
   return
 }

 team=found;
 sessionStorage.setItem("lifelineTeamV10",team);

 // Immediate visible confirmation, no waiting screen.
 $("loginCard").classList.add("hidden");
 $("game").classList.remove("hidden");
 $("game").innerHTML=`<div class="card hero">
   <div class="title">&gt;&gt; AUTHENTICATION SUCCESSFUL</div>
   <div class="terminal online">FIELD UNIT: ${esc(team)}
REALTIME LINK: CONNECTING...</div>
 </div>`;

 // Voice stays in the direct user-click flow.
 speakDeep("Authentifizierung erfolgreich. Team "+team+" verbunden.");

 // Start realtime listener immediately, before writing.
 connectTeam();

 // Firebase status write should never block navigation.
 update(ref(db,"mission/teams/"+team),{
   started:true,
   lastUpdate:serverTimestamp()
 }).catch(e=>{
   console.error("Team start write failed",e);
   $("net").textContent="REALTIME WRITE ERROR";
   $("net").style.color="#ff7083";
 });

 // Render from current cached state if available.
 setTimeout(()=>{lastScreenKey="";render()},50);
}
function connectTeam(){
 if(!team||!cfg)return;

 $("loginCard").classList.add("hidden");
 $("game").classList.remove("hidden");

 // Provide a local default so the UI never waits on the first Firebase packet.
 if(!state){
   state={started:true,step:0,done:[],fragments:[],hints:0,penalty:0,online:false};
   lastScreenKey="";
   render();
 }

 if(unsubTeam){
   try{unsubTeam()}catch(e){}
   unsubTeam=null;
 }

 unsubTeam=onValue(ref(db,"mission/teams/"+team),snap=>{
   state=snap.val()||{started:true,step:0,done:[],fragments:[],hints:0,penalty:0,online:false};
   lastScreenKey="";
   $("net").textContent="REALTIME CONNECTED";
   $("net").style.color="#5fa572";
   render();
 },error=>{
   console.error("Team listener error",error);
   $("net").textContent="REALTIME READ ERROR";
   $("net").style.color="#ff7083";
   lastScreenKey="";
   render();
 });
}
function emptyTeamState(){return {started:true,step:0,done:[],fragments:[],hints:0,penalty:0,online:false,runId:globalState?.runId||0,lastUpdate:0}}
let resetPending=false;
async function resetThisTeamForRun(){
 if(!team||!globalState||resetPending)return;
 resetPending=true;
 try{await set(ref(db,"mission/teams/"+team),emptyTeamState())}finally{resetPending=false}
}
function pickDeepVoice(){
 const voices=speechSynthesis.getVoices();
 const de=voices.filter(v=>String(v.lang||"").toLowerCase().startsWith("de"));
 return de.find(v=>/markus|martin|stefan|thomas|male|mann|daniel|reed/i.test(v.name))||de[0]||voices.find(v=>/male|daniel|reed/i.test(v.name))||voices[0];
}
function speakDeep(text,rate=.72,pitch=.35){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(String(text));u.lang="de-DE";u.rate=rate;u.pitch=pitch;u.volume=1;const v=pickDeepVoice();if(v)u.voice=v;speechSynthesis.speak(u);
}
function primeVoice(){
 if(!("speechSynthesis" in window))return;
 const u=new SpeechSynthesisUtterance("System Audio aktiviert");u.lang="de-DE";u.rate=.72;u.pitch=.35;u.volume=.01;const v=pickDeepVoice();if(v)u.voice=v;speechSynthesis.speak(u);
}
async function maybeStartCountdownFromTeams(){
 if(!db||!globalState||countdownStartPending)return;
 if(Number(globalState.countdownStartedAt||0)>0)return;
 const allOnline=TEAM_NAMES.every(n=>allTeamStates&&allTeamStates[n]&&allTeamStates[n].online===true);
 if(!allOnline)return;
 countdownStartPending=true;
 try{
   await update(ref(db,"mission/globalState"),{countdownStartedAt:serverTimestamp(),missionComplete:false});
 }catch(e){
   // Bei gleichzeitigem Start durch mehrere Tablets gewinnt nur eines. Das ist erwartbar.
   console.warn("Countdown start attempt",e?.code||e);
 }finally{
   countdownStartPending=false;
 }
}
function countdownActive(){return !!(globalState&&globalState.countdownStartedAt&&globalState.countdownStartedAt>0)}
function renderCountdown(){
 if(!globalState||!globalState.countdownStartedAt)return false;
 const seconds=Number(cfg?.countdownSeconds||10);
 const elapsed=Math.max(0,Date.now()-Number(globalState.countdownStartedAt));
 const remaining=Math.ceil(seconds-elapsed/1000);
 if(remaining<=0){
   if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}lastSpokenSecond=null;
   $("game").classList.remove("hidden");$("game").innerHTML=`<div class="card hero countdown-screen"><div class="complete-title">MISSION COMPLETE</div><div class="terminal" style="margin-top:20px">GLOBAL LIFELINE RESTORED\n6 / 6 FIELD UNITS ONLINE</div><button id="completeVoice" type="button">🔊 SYSTEM MESSAGE</button></div>`;
   $("completeVoice").onclick=()=>speakDeep("Mission Complete. Global Lifeline wiederhergestellt.");
   if(!window.__completeSpoken){window.__completeSpoken=true;speakDeep("Mission Complete. Global Lifeline wiederhergestellt.")}
   return true;
 }
 $("game").classList.remove("hidden");$("game").innerHTML=`<div class="card hero countdown-screen"><div class="title">&gt;&gt; GLOBAL LIFELINE SYNCHRONIZATION</div><p class="muted">ALLE 6 FIELD UNITS ONLINE</p><div class="countdown-number">${remaining}</div><div class="terminal">FINAL SYSTEM ACTIVATION IN PROGRESS</div></div>`;
 if(lastSpokenSecond!==remaining){lastSpokenSecond=remaining;speakDeep(String(remaining),.68,.28)}
 if(!countdownTimer)countdownTimer=setInterval(()=>{renderCountdown()},200);
 return true;
}
async function maybeStartCountdownFromTeamClients(){
 if(!cfg||countdownStartPending)return;
 const cd=cfg?.run?.countdown||{};
 if(Number(cd.startAt||0)>0)return;

 const allOnline=TEAM_NAMES.every(n=>allTeamStates?.[n]?.online===true);
 if(!allOnline)return;

 countdownStartPending=true;
 try{
   const duration=Math.max(3,Number(cd.duration||10));
   const run={...(cfg.run||{}),countdown:{startAt:Date.now()+3000,duration}};
   await update(ref(db,"mission/publicConfig"),{run});
 }catch(e){
   console.warn("Client countdown start not permitted/failed",e);
 }finally{
   countdownStartPending=false;
 }
}

function render(){
 if(!state||!cfg)return;

 const countdown=cfg?.run?.countdown||null;
 if(countdown && Number(countdown.startAt||0)>0){
   renderGlobalCountdown(countdown);
   return;
 }

 const r=route();
 let mode="core";
 if(state.online) mode="waiting";
 else if(state.step>=r.length) mode="final";

 const idx=mode==="core"?currentIdx():null;
 const key=[mode,state.step,idx,state.online,(state.fragments||[]).join("|")].join("::");
 if(key===lastScreenKey)return;
 lastScreenKey=key;

 $("game").classList.remove("hidden");

 if(mode==="waiting"){
   $("game").innerHTML=`<div class="card hero online-card">
     <div class="title">&gt;&gt; LIFELINE NODE</div>
     <div class="big">ONLINE</div>
     <div class="terminal">FIELD UNIT: ${team}
MISSION STATUS: WAITING FOR GLOBAL COMPLETION</div>
     <p class="muted">Sobald alle sechs Teams online sind, startet der gemeinsame Countdown.</p>
   </div>`;
   return;
 }

 if(mode==="final"){
   const fragments=(state.fragments||[]).map((f,i)=>(i+1)+". "+esc(f)).join("<br>");
   $("game").innerHTML=`<div class="card hero">
     <div class="title">&gt;&gt; FINAL LIFELINE ACCESS</div>
     <p class="muted">Nutzt eure gesammelten Fragmente und bestimmt das Lifeline-Passwort.</p>
     <div class="terminal">${fragments}</div>
     <label>LIFELINE PASSWORT</label>
     <input id="finalInput" placeholder="Passwort eingeben">
     <button id="finalBtn" class="primary" type="button">VERIFY LIFELINE PASSWORD</button>
     <div id="feedback"></div>
   </div>`;
   $("finalBtn").onclick=verifyFinal;
   return;
 }

 const c=cfg.cores[idx];
 if(!c){
   $("game").innerHTML='<div class="card hero"><div class="terminal red">MISSION CONFIG ERROR // CORE NOT FOUND</div></div>';
   return;
 }
 $("game").innerHTML=`<div class="card hero">
   <div class="small muted">FIELD UNIT // ${team}</div>
   <div class="big">${state.step}/6</div>
   <div class="progress"><div style="width:${state.step/6*100}%"></div></div>
 </div>
 <div class="card" style="margin-top:14px">
   <div class="title">${esc(c.name)}</div>
   <div class="terminal">${esc(c.message)}</div>
   <div class="row" style="margin-top:10px"><button id="voiceBtn" type="button">🔊 PLAY MESSAGE</button></div>
   <label>CODE FROM PHYSICAL STATION</label>
   <input id="answerInput" placeholder="Code eingeben">
   <div class="row">
     <button id="answerBtn" class="primary" type="button">VERIFY ACCESS</button>
     <button id="hintBtn" type="button">REQUEST HINT</button>
   </div>
   <div id="feedback"></div>
 </div>`;
 $("voiceBtn").onclick=()=>speak(c.message);
 $("answerBtn").onclick=verifyAnswer;
 $("hintBtn").onclick=requestHint;
}

function renderGlobalCountdown(cd){
 $("game").classList.remove("hidden");
 const startAt=Number(cd.startAt||0);
 const duration=Math.max(3,Number(cd.duration||10));
 if(!startAt)return;

 if(countdownTimer)return;

 const tick=()=>{
   const now=Date.now();
   const remaining=Math.max(0,Math.ceil((startAt + duration*1000 - now)/1000));
   const key="countdown::"+remaining;

   if(key!==lastScreenKey){
     lastScreenKey=key;
     $("game").innerHTML=`<div class="card hero global-online" style="text-align:center">
       <div class="title">&gt;&gt; GLOBAL LIFELINE SYNCHRONIZATION</div>
       <div class="big" style="font-size:${remaining>0?"84px":"46px"}">${remaining>0?remaining:"MISSION COMPLETE"}</div>
       <div class="terminal">${remaining>0?"ALLE TEAMS ONLINE<br>FINAL COUNTDOWN ACTIVE":"GLOBAL LIFELINE RESTORED<br>MISSION COMPLETE"}</div>
     </div>`;
   }

   if(remaining>0){
     if(lastSpokenCountdown!==remaining){
       lastSpokenCountdown=remaining;
       speak(String(remaining));
     }
   }else{
     if(lastSpokenCountdown!=="complete"){
       lastSpokenCountdown="complete";
       speak("Mission Complete. Global Lifeline restored.");
     }
     clearInterval(countdownTimer);
     countdownTimer=null;
   }
 };

 tick();
 if(lastSpokenCountdown!=="complete"){
   countdownTimer=setInterval(tick,200);
 }
}

async function verifyAnswer(){
 const idx=currentIdx(),entered=await sha($("answerInput").value.trim().toUpperCase()),expected=cfg.answerHashes[team][idx];
 if(entered!==expected){
   $("feedback").innerHTML='<div class="card" style="margin-top:12px;border-color:#ff4d67;box-shadow:0 0 25px #ff4d6730"><div class="title red">✕ FALSCHER CODE</div><div class="terminal red">ACCESS DENIED // Der eingegebene Code ist nicht korrekt. Prüft eure Lösung und versucht es erneut.</div></div>';
   await update(ref(db,"mission/teams/"+team),{penalty:(state.penalty||0)+2,lastUpdate:serverTimestamp()});
   speakDeep("Zugriff verweigert. Der eingegebene Code ist falsch. Prüft eure Lösung und versucht es erneut.");
   return;
 }
 const fragment=cfg.fragments[team][idx],done=[...(state.done||[])];if(!done.includes(idx))done.push(idx);const fragments=[...(state.fragments||[]),fragment];
 await update(ref(db,"mission/teams/"+team),{done,fragments,step:state.step+1,lastUpdate:serverTimestamp()});
 showFragment(fragment);
}
function showFragment(fragment){$("game").innerHTML=`<div class="card hero"><div class="title">&gt;&gt; SYSTEM FRAGMENT RECOVERED</div><div class="terminal" style="text-align:center"><div class="big">${esc(fragment)}</div>SAVE THIS FRAGMENT FOR FINAL ACCESS</div><div class="row"><button id="fragVoiceBtn" type="button">🔊 SYSTEM MESSAGE</button><button id="continueBtn" class="primary" type="button">CONTINUE MISSION</button></div></div>`;$("fragVoiceBtn").onclick=()=>speakDeep("Systemfragment gesichert. Euer Fragment lautet "+fragment+". Merkt euch dieses Fragment für den finalen Zugriff.");$("continueBtn").onclick=()=>{lastScreenKey="";render()};speakDeep("Systemfragment gesichert. Euer Fragment lautet "+fragment)}
async function requestHint(){await update(ref(db,"mission/teams/"+team),{hints:(state.hints||0)+1,lastUpdate:serverTimestamp()});$("feedback").innerHTML='<div class="terminal warnc">MISSION CONTROL INFORMED</div>'}
async function verifyFinal(){
 const entered=await sha($("finalInput").value.trim().toUpperCase());

function startMatrix(){
 const c=document.getElementById("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];
 function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}
 resize();addEventListener("resize",resize);
 function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()
}
